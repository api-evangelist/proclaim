name: Proclaim
description: >-
  Proclaim, built by Fresh Health, Inc., makes a custom-jet oral health system that
  replaces traditional flossing with a 3D-scanned, custom-fitted mouthpiece that pulses
  water through up to 60 jets to clean between teeth and below the gumline in about seven
  seconds. The consumer device is clinically shown to reduce gum bleeding and plaque, and
  is backed by Khosla Ventures. Proclaim is a direct-to-consumer oral-care hardware and
  wellness brand; it publishes a marketing and e-commerce site, a dental-professional
  portal, a help/knowledge center, and a blog, but exposes no public API, developer portal,
  SDKs, or machine-readable specification. This profile was surfaced as a Khosla Ventures
  portfolio lead and enriched with the identity and web properties the company actually
  publishes plus a probed domain-security profile; there is no API surface to catalog.
